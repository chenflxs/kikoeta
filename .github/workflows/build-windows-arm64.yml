name: Build Windows ARM64 installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-arm64:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Flutter stable currently publishes a Windows x64 SDK only.
          # The x64 toolchain can cross-build ARM64 through assemble + CMake.
          architecture: x64
          cache: true

      - name: Set up Rust ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Download Flutter Windows ARM64 engine
        shell: pwsh
        run: |
          $engineRevision = (Get-Content -LiteralPath (Join-Path $env:FLUTTER_ROOT 'bin/internal/engine.version') -Raw).Trim()
          if (-not $engineRevision) {
            throw 'Could not determine the Flutter engine revision'
          }

          $engineDir = Join-Path $env:FLUTTER_ROOT 'bin/cache/artifacts/engine'
          $baseUrl = "https://storage.googleapis.com/flutter_infra_release/flutter/$engineRevision"
          $archives = @(
            @{ Directory = 'windows-arm64'; Archive = 'windows-arm64-debug/windows-arm64-flutter.zip' },
            @{ Directory = 'windows-arm64'; Archive = 'windows-arm64/flutter-cpp-client-wrapper.zip' },
            @{ Directory = 'windows-arm64-release'; Archive = 'windows-arm64-release/windows-arm64-flutter.zip' }
          )

          foreach ($item in $archives) {
            $destination = Join-Path $engineDir $item.Directory
            $archivePath = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileName($item.Archive))
            Invoke-WebRequest -Uri "$baseUrl/$($item.Archive)" -OutFile $archivePath
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            Expand-Archive -LiteralPath $archivePath -DestinationPath $destination -Force
          }

          # ICU data is architecture-independent and is not included in the
          # Windows ARM64 engine archive, although Flutter expects it there.
          $icuSource = Join-Path $engineDir 'windows-x64/icudtl.dat'
          $icuDestination = Join-Path $engineDir 'windows-arm64/icudtl.dat'
          if (-not (Test-Path -LiteralPath $icuSource -PathType Leaf)) {
            throw "Flutter ICU data was not found at $icuSource"
          }
          Copy-Item -LiteralPath $icuSource -Destination $icuDestination -Force

      - name: Read version from pubspec
        shell: pwsh
        run: |
          $pubspecPath = Join-Path $env:GITHUB_WORKSPACE 'app/pubspec.yaml'
          $pubspec = Get-Content -LiteralPath $pubspecPath -Raw
          $match = [regex]::Match($pubspec, '(?m)^version:\s*(?<name>[^\s+]+)\+(?<code>\d+)\s*$')
          if (-not $match.Success) {
            throw "Could not read version: NAME+CODE from $pubspecPath"
          }

          $versionName = $match.Groups['name'].Value
          $versionCode = $match.Groups['code'].Value
          "VERSION_NAME=$versionName" >> $env:GITHUB_ENV
          "VERSION_CODE=$versionCode" >> $env:GITHUB_ENV
          "Read Kikoeta version $versionName+$versionCode"

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate Windows project configuration
        working-directory: app
        run: flutter build windows --config-only --build-name "$env:VERSION_NAME" --build-number "$env:VERSION_CODE"

      - name: Build Windows ARM64 runner with CMake
        working-directory: app
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe was not found at $vswhere"
          }
          $visualStudio = (& $vswhere -latest -products * -format json -utf8 | ConvertFrom-Json | Select-Object -First 1)
          if ($null -eq $visualStudio) {
            throw 'No Visual Studio installation was found'
          }
          $majorVersion = [int]($visualStudio.installationVersion.Split('.')[0])
          $generator = switch ($majorVersion) {
            18 { 'Visual Studio 18 2026' }
            17 { 'Visual Studio 17 2022' }
            default { throw "Unsupported Visual Studio version: $($visualStudio.installationVersion)" }
          }
          $cmake = Join-Path $visualStudio.installationPath 'Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin/cmake.exe'
          if (-not (Test-Path -LiteralPath $cmake -PathType Leaf)) {
            throw "Visual Studio CMake was not found at $cmake"
          }
          Write-Host "Using $generator at $($visualStudio.installationPath)"
          & $cmake -S windows -B build/windows/arm64 -G $generator -A ARM64 `
            -DFLUTTER_TARGET_PLATFORM=windows-arm64 `
            -DCMAKE_DISABLE_FIND_PACKAGE_JNI=TRUE
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed with exit code $LASTEXITCODE"
          }
          & $cmake --build build/windows/arm64 --config Release --target INSTALL
          if ($LASTEXITCODE -ne 0) {
            throw "CMake build failed with exit code $LASTEXITCODE"
          }

      - name: Verify ARM64 build output
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'app/build/windows/arm64/runner/Release'
          $executable = Join-Path $releaseDir 'kikoeta_app.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Flutter ARM64 output was not found: $executable"
          }
          $bytes = [System.IO.File]::ReadAllBytes($executable)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0xaa64) {
            throw ("Expected ARM64 PE (0xAA64), found machine 0x{0:X4}" -f $machine)
          }
          "FLUTTER_RELEASE_DIR=$releaseDir" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.0 --no-progress --yes

      - name: Build Inno installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "ISCC.exe was not found at $iscc"
          }

          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $outputName = "kikoeta-$env:VERSION_NAME-windows-arm64-setup"
          & $iscc `
            "/DMyAppVersion=$env:VERSION_NAME" `
            "/DMyAppVersionCode=$env:VERSION_CODE" `
            "/DMySourceDir=$env:FLUTTER_RELEASE_DIR" `
            "/DMyOutputDir=$outputDir" `
            "/DMyOutputBaseFilename=$outputName" `
            "/DMyArchitecturesAllowed=arm64" `
            (Join-Path $env:GITHUB_WORKSPACE 'kikoeta-installer.iss')
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $installer = Join-Path $outputDir "$outputName.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Installer was not created: $installer"
          }
          "INSTALLER_PATH=$installer" >> $env:GITHUB_ENV

      - name: Upload Windows ARM64 installer
        uses: actions/upload-artifact@v4
        with:
          name: kikoeta-${{ env.VERSION_NAME }}-windows-arm64
          path: ${{ env.INSTALLER_PATH }}
          if-no-files-found: error
